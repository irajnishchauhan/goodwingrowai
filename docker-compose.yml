version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: goodwin_postgres
    restart: always
    environment:
      POSTGRES_USER: goodwin_user
      POSTGRES_PASSWORD: goodwin_password
      POSTGRES_DB: goodwin_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: goodwin_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog
    container_name: goodwin_mailhog
    restart: always
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI

volumes:
  postgres_data:
  redis_data:
